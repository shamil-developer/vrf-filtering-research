topology:
  bridge: br0
  vrf: vrf-blue
  directions:
    - name: client-to-bridge
      segment: bridge
      iif: veth-c
      oif: veth-b
      explanation: 'Клиентский край bridge br0: трафик идет от veth-c к veth-b.'
    - name: bridge-to-vrf
      segment: bridge-vrf
      iif: veth-b
      oif: veth-vrf
      explanation: 'Переход от bridge br0 в сторону VRF vrf-blue.'
    - name: vrf-to-server
      segment: vrf
      iif: veth-vrf
      oif: veth-s
      explanation: 'Участок внутри VRF vrf-blue к серверному краю.'
    - name: server-to-vrf
      segment: vrf
      iif: veth-s
      oif: veth-vrf
      explanation: 'Обратный путь от серверного края к VRF vrf-blue.'
    - name: vrf-to-bridge
      segment: bridge-vrf
      iif: veth-vrf
      oif: veth-b
      explanation: 'Обратный переход от VRF vrf-blue к bridge br0.'
    - name: bridge-to-client
      segment: bridge
      iif: veth-b
      oif: veth-c
      explanation: 'Обратный путь bridge br0 к клиентскому краю.'

actions:
  - name: counter
    template: 'counter'
    match_template: 'counter'
    explanation: 'Считает непопадающие пакеты, не меняя решение по трафику.'
    match_explanation: 'Считает совпавший iperf-трафик.'
  - name: accept
    template: 'accept'
    match_template: 'accept'
    explanation: 'Явно пропускает непопадающий синтетический трафик.'
    match_explanation: 'Явно пропускает совпавший iperf-трафик.'
  - name: drop
    template: 'drop'
    match_template: 'counter'
    explanation: 'Дропает только синтетический непопадающий трафик, чтобы не ломать iperf.'
    match_explanation: 'Для совпавшего iperf-трафика заменяется на counter.'
  - name: meta-mark-set
    template: 'meta mark set {mark} counter'
    match_template: 'meta mark set {mark} counter'
    explanation: 'Выставляет skb mark и считает пакет.'
    match_explanation: 'Выставляет mark на совпавший iperf-трафик и считает пакет.'
  - name: log
    template: 'log prefix "bench-{index}-{segment}" counter'
    match_template: 'counter'
    explanation: 'Логирует только синтетический непопадающий трафик.'
    match_explanation: 'Для совпавшего iperf-трафика заменяется на counter, чтобы не зашумлять лог.'
  - name: nftrace
    template: 'meta nftrace set 1 counter'
    match_template: 'counter'
    explanation: 'Включает nftrace только на синтетическом непопадающем трафике.'
    match_explanation: 'Для совпавшего iperf-трафика заменяется на counter.'
  - name: queue
    template: 'queue num 0'
    match_template: 'counter'
    explanation: 'Отправляет только синтетический непопадающий трафик в queue.'
    match_explanation: 'Для совпавшего iperf-трафика заменяется на counter.'
  - name: rate-limit
    template: 'limit rate over 1000 mbytes/second counter'
    match_template: 'counter'
    explanation: 'Добавляет limit expression и счетчик.'
    match_explanation: 'Для совпавшего iperf-трафика заменяется на counter.'

profiles:
  easy_source_ip:
    family: inet
    table: bench
    chain: forward
    hook: forward
    priority: 0
    policy: accept
    match_every: 10
    final_rule: 'accept'
    rules:
      - name: 'IP источника'
        template: 'ip saddr 198.18.{a}.{b} {action}'
        match_template: 'ip saddr 10.0.1.2 tcp dport 5201 {action}'
        explanation: 'Проверяет IP источника, которого нет у тестового клиента.'
        match_explanation: 'Проверяет реальный iperf-трафик от клиента 10.0.1.2.'
      - name: 'IP назначения'
        template: 'ip daddr 203.0.113.{b} {action}'
        match_template: 'ip daddr 10.0.2.2 tcp dport 5201 {action}'
        explanation: 'Проверяет IP назначения, который не является тестовым сервером.'
        match_explanation: 'Проверяет реальный iperf-трафик к серверу 10.0.2.2.'
      - name: 'TCP source port'
        template: 'tcp sport {port} {action}'
        match_template: 'tcp sport 5201 {action}'
        explanation: 'Проверяет исходный TCP-порт, который не используется iperf-сервером.'
        match_explanation: 'Проверяет обратный TCP-трафик от iperf-сервера.'
      - name: 'TCP destination port'
        template: 'tcp dport {port} {action}'
        match_template: 'tcp dport 5201 {action}'
        explanation: 'Проверяет TCP-порт назначения, отличный от iperf-порта 5201.'
        match_explanation: 'Проверяет прямой TCP-трафик к iperf-порту 5201.'
      - name: 'UDP source port'
        template: 'udp sport {port} {action}'
        match_template: 'ip protocol tcp tcp dport 5201 {action}'
        explanation: 'Проверяет UDP source port, поэтому TCP iperf-трафик идет дальше.'
        match_explanation: 'Контрольное совпадение по TCP iperf-трафику вместо UDP.'
      - name: 'UDP destination port'
        template: 'udp dport {port} {action}'
        match_template: 'ip protocol tcp tcp dport 5201 {action}'
        explanation: 'Проверяет UDP destination port, поэтому TCP iperf-трафик идет дальше.'
        match_explanation: 'Контрольное совпадение по TCP iperf-трафику вместо UDP.'
      - name: 'L4 protocol'
        template: 'ip protocol udp {action}'
        match_template: 'ip protocol tcp tcp dport 5201 {action}'
        explanation: 'Проверяет L4-протокол UDP, а тестовый поток идет по TCP.'
        match_explanation: 'Проверяет L4-протокол TCP у iperf-трафика.'
      - name: 'IP TTL'
        template: 'ip saddr 198.18.{a}.{b} ip ttl {ttl} {action}'
        match_template: 'ip saddr 10.0.1.2 tcp dport 5201 {action}'
        explanation: 'Проверяет TTL со значением, не привязанным к тестовому потоку.'
        match_explanation: 'Контрольное совпадение по клиентскому iperf-трафику.'
      - name: 'IP length'
        template: 'ip saddr 198.18.{a}.{b} ip length {length} {action}'
        match_template: 'ip saddr 10.0.1.2 tcp dport 5201 {action}'
        explanation: 'Проверяет длину IPv4-пакета с переменным значением.'
        match_explanation: 'Контрольное совпадение по клиентскому iperf-трафику.'
      - name: 'ICMP type'
        template: 'ip protocol icmp icmp type echo-request {action}'
        match_template: 'ip protocol tcp tcp dport 5201 {action}'
        explanation: 'Проверяет ICMP echo-request, а iperf идет по TCP.'
        match_explanation: 'Контрольное совпадение по TCP iperf-трафику.'
      - name: 'Input interface'
        template: 'iifname "{iif}" oifname "{oif}" ip saddr 198.18.{a}.{b} {action}'
        match_template: 'iifname "{iif}" oifname "{oif}" tcp dport 5201 {action}'
        explanation: 'Проверяет входной интерфейс в связке с выходом текущего участка карты и синтетический IP.'
        match_explanation: 'Проверяет входной интерфейс в связке с выходом текущего участка карты на iperf-трафике.'
      - name: 'Output interface'
        template: 'iifname "{iif}" oifname "{oif}" ip saddr 198.18.{a}.{b} {action}'
        match_template: 'iifname "{iif}" oifname "{oif}" tcp dport 5201 {action}'
        explanation: 'Проверяет выходной интерфейс в связке со входом текущего участка карты и синтетический IP.'
        match_explanation: 'Проверяет выходной интерфейс в связке со входом текущего участка карты на iperf-трафике.'
      - name: 'Meta length'
        template: 'ip saddr 198.18.{a}.{b} meta length {length} {action}'
        match_template: 'ip saddr 10.0.1.2 tcp dport 5201 {action}'
        explanation: 'Проверяет длину пакета через meta expression.'
        match_explanation: 'Контрольное совпадение по клиентскому iperf-трафику.'

  medium_tcp_flow:
    family: inet
    table: bench
    chain: forward
    hook: forward
    priority: 0
    policy: accept
    match_every: 10
    final_rule: 'accept'
    rules:
      - name: 'Source and destination IP'
        template: 'ip saddr 198.18.{a}.{b} ip daddr 203.0.113.{b} {action}'
        match_template: 'ip saddr 10.0.1.2 ip daddr 10.0.2.2 tcp dport 5201 {action}'
        explanation: 'Проверяет пару IP-адресов, которая не относится к тестовому потоку.'
        match_explanation: 'Проверяет реальные IP клиента и сервера iperf.'
      - name: 'TCP source and destination ports'
        template: 'tcp sport {port} tcp dport {port} {action}'
        match_template: 'tcp dport 5201 {action}'
        explanation: 'Проверяет пару TCP-портов с синтетическими значениями.'
        match_explanation: 'Проверяет TCP destination port iperf.'
      - name: 'Input and output interfaces'
        template: 'iifname "{iif}" oifname "{oif}" ip saddr 198.18.{a}.{b} {action}'
        match_template: 'iifname "{iif}" oifname "{oif}" tcp dport 5201 {action}'
        explanation: 'Проверяет пару интерфейсов текущего участка карты и синтетический IP.'
        match_explanation: 'Проверяет пару интерфейсов текущего участка карты на iperf-трафике.'
      - name: 'Source IP and TCP port'
        template: 'ip saddr 198.18.{a}.{b} tcp dport {port} {action}'
        match_template: 'ip saddr 10.0.1.2 tcp dport 5201 {action}'
        explanation: 'Проверяет IP источника и TCP-порт, оба значения синтетические.'
        match_explanation: 'Проверяет клиента и порт iperf.'
      - name: 'Destination IP and TCP source port'
        template: 'ip daddr 203.0.113.{b} tcp sport {port} {action}'
        match_template: 'ip daddr 10.0.2.2 tcp dport 5201 {action}'
        explanation: 'Проверяет IP назначения и source port, не совпадающие с прямым iperf-потоком.'
        match_explanation: 'Проверяет сервер и порт назначения iperf.'
      - name: 'Protocol and port'
        template: 'meta l4proto udp udp dport {port} {action}'
        match_template: 'meta l4proto tcp tcp dport 5201 {action}'
        explanation: 'Проверяет L4-протокол и порт для UDP.'
        match_explanation: 'Проверяет TCP и порт назначения iperf.'
      - name: 'TCP SYN flag'
        template: 'tcp flags & syn == syn tcp dport {port} {action}'
        match_template: 'tcp flags & syn == syn tcp dport 5201 {action}'
        explanation: 'Проверяет SYN-флаг и синтетический TCP-порт.'
        match_explanation: 'Проверяет SYN-пакеты при установлении iperf-соединения.'
      - name: 'TCP ACK flag'
        template: 'tcp flags & ack == ack tcp dport {port} {action}'
        match_template: 'tcp flags & ack == ack tcp dport 5201 {action}'
        explanation: 'Проверяет ACK-флаг и синтетический TCP-порт.'
        match_explanation: 'Проверяет ACK-пакеты iperf-потока.'
      - name: 'TCP FIN or RST flags'
        template: 'tcp flags & (fin|rst) != 0 tcp dport {port} {action}'
        match_template: 'tcp flags & (fin|rst) != 0 tcp dport 5201 {action}'
        explanation: 'Проверяет FIN/RST и синтетический TCP-порт.'
        match_explanation: 'Проверяет закрытие TCP-соединения iperf.'
      - name: 'Meta mark'
        template: 'meta mark {mark} {action}'
        match_template: 'ip saddr 10.0.1.2 tcp dport 5201 {action}'
        explanation: 'Проверяет skb mark с синтетическим значением.'
        match_explanation: 'Контрольное совпадение по клиентскому iperf-трафику.'
      - name: 'Meta priority'
        template: 'meta priority {mark} {action}'
        match_template: 'ip saddr 10.0.1.2 tcp dport 5201 {action}'
        explanation: 'Проверяет priority метаданных пакета.'
        match_explanation: 'Контрольное совпадение по клиентскому iperf-трафику.'
      - name: 'Meta skuid'
        template: 'meta skuid {mark} {action}'
        match_template: 'ip saddr 10.0.1.2 tcp dport 5201 {action}'
        explanation: 'Проверяет UID владельца socket, обычно не совпадает в forward-трафике.'
        match_explanation: 'Контрольное совпадение по клиентскому iperf-трафику.'
      - name: 'Meta skgid'
        template: 'meta skgid {mark} {action}'
        match_template: 'ip saddr 10.0.1.2 tcp dport 5201 {action}'
        explanation: 'Проверяет GID владельца socket, обычно не совпадает в forward-трафике.'
        match_explanation: 'Контрольное совпадение по клиентскому iperf-трафику.'
      - name: 'Limit rate'
        template: 'ip saddr 198.18.{a}.{b} limit rate over 1000 mbytes/second {action}'
        match_template: 'ip saddr 10.0.1.2 tcp dport 5201 {action}'
        explanation: 'Проверяет rate-limit expression на синтетическом IP.'
        match_explanation: 'Контрольное совпадение по клиентскому iperf-трафику.'
      - name: 'Random generator'
        template: 'numgen random mod 1000 == {mark} ip saddr 198.18.{a}.{b} {action}'
        match_template: 'ip saddr 10.0.1.2 tcp dport 5201 {action}'
        explanation: 'Проверяет numgen random вместе с синтетическим IP.'
        match_explanation: 'Контрольное совпадение по клиентскому iperf-трафику.'
      - name: 'Payload length'
        template: 'meta length {length} ip saddr 198.18.{a}.{b} {action}'
        match_template: 'ip saddr 10.0.1.2 tcp dport 5201 {action}'
        explanation: 'Проверяет длину пакета и IP источника.'
        match_explanation: 'Контрольное совпадение по клиентскому iperf-трафику.'
      - name: 'IP fragment offset'
        template: 'ip frag-off {mark} {action}'
        match_template: 'ip saddr 10.0.1.2 tcp dport 5201 {action}'
        explanation: 'Проверяет IPv4 fragment offset.'
        match_explanation: 'Контрольное совпадение по клиентскому iperf-трафику.'
      - name: 'IP DSCP'
        template: 'ip dscp cs1 {action}'
        match_template: 'ip saddr 10.0.1.2 tcp dport 5201 {action}'
        explanation: 'Проверяет DSCP-класс пакета.'
        match_explanation: 'Контрольное совпадение по клиентскому iperf-трафику.'

  hard_conntrack:
    family: inet
    table: bench
    chain: forward
    hook: forward
    priority: 0
    policy: accept
    match_every: 10
    final_rule: 'accept'
    rules:
      - name: 'Conntrack state'
        template: 'ct state invalid ip saddr 198.18.{a}.{b} {action}'
        match_template: 'ct state established,related tcp dport 5201 {action}'
        explanation: 'Проверяет conntrack state invalid для синтетического IP.'
        match_explanation: 'Проверяет установленный iperf-поток через conntrack.'
      - name: 'Conntrack status'
        template: 'ct status dnat ip saddr 198.18.{a}.{b} {action}'
        match_template: 'ct state established,related tcp dport 5201 {action}'
        explanation: 'Проверяет conntrack status DNAT, которого нет в тестовом потоке.'
        match_explanation: 'Контрольное совпадение по установленному iperf-потоку.'
      - name: 'Conntrack direction'
        template: 'ct direction reply ip saddr 198.18.{a}.{b} {action}'
        match_template: 'ct direction original tcp dport 5201 {action}'
        explanation: 'Проверяет направление conntrack reply с синтетическим IP.'
        match_explanation: 'Проверяет original-направление прямого iperf-трафика.'
      - name: 'Conntrack mark'
        template: 'ct mark {mark} ip saddr 198.18.{a}.{b} {action}'
        match_template: 'ct state established,related tcp dport 5201 {action}'
        explanation: 'Проверяет conntrack mark с синтетическим значением.'
        match_explanation: 'Контрольное совпадение по установленному iperf-потоку.'
      - name: 'Conntrack zone'
        template: 'ct zone {zone} ip saddr 198.18.{a}.{b} {action}'
        match_template: 'ct state established,related tcp dport 5201 {action}'
        explanation: 'Проверяет conntrack zone с синтетическим значением.'
        match_explanation: 'Контрольное совпадение по установленному iperf-потоку.'
      - name: 'Conntrack original source'
        template: 'ct original ip saddr 198.18.{a}.{b} {action}'
        match_template: 'ct original ip saddr 10.0.1.2 tcp dport 5201 {action}'
        explanation: 'Проверяет original source address, отличный от клиента.'
        match_explanation: 'Проверяет original source address клиента iperf.'
      - name: 'Conntrack original destination'
        template: 'ct original ip daddr 203.0.113.{b} {action}'
        match_template: 'ct original ip daddr 10.0.2.2 tcp dport 5201 {action}'
        explanation: 'Проверяет original destination address, отличный от сервера.'
        match_explanation: 'Проверяет original destination address сервера iperf.'
      - name: 'Conntrack reply source'
        template: 'ct reply ip saddr 203.0.113.{b} {action}'
        match_template: 'ct reply ip saddr 10.0.2.2 tcp sport 5201 {action}'
        explanation: 'Проверяет reply source address, отличный от сервера.'
        match_explanation: 'Проверяет reply source address сервера iperf.'
      - name: 'Conntrack reply destination'
        template: 'ct reply ip daddr 198.18.{a}.{b} {action}'
        match_template: 'ct reply ip daddr 10.0.1.2 tcp sport 5201 {action}'
        explanation: 'Проверяет reply destination address, отличный от клиента.'
        match_explanation: 'Проверяет reply destination address клиента iperf.'
      - name: 'Conntrack original source port'
        template: 'ct original ip saddr 198.18.{a}.{b} tcp sport {port} {action}'
        match_template: 'ct original ip saddr 10.0.1.2 tcp dport 5201 {action}'
        explanation: 'Проверяет original tuple через conntrack IP и TCP source port.'
        match_explanation: 'Проверяет original tuple клиента и destination port iperf.'
      - name: 'Conntrack original destination port'
        template: 'ct original ip daddr 203.0.113.{b} tcp dport {port} {action}'
        match_template: 'ct original ip daddr 10.0.2.2 tcp dport 5201 {action}'
        explanation: 'Проверяет original tuple через conntrack IP и TCP destination port.'
        match_explanation: 'Проверяет original tuple сервера и destination port iperf.'
      - name: 'Conntrack reply source port'
        template: 'ct reply ip saddr 203.0.113.{b} tcp sport {port} {action}'
        match_template: 'ct reply ip saddr 10.0.2.2 tcp sport 5201 {action}'
        explanation: 'Проверяет reply tuple через conntrack IP и TCP source port.'
        match_explanation: 'Проверяет reply tuple сервера и source port iperf.'
      - name: 'Conntrack reply destination port'
        template: 'ct reply ip daddr 198.18.{a}.{b} tcp dport {port} {action}'
        match_template: 'ct reply ip daddr 10.0.1.2 tcp sport 5201 {action}'
        explanation: 'Проверяет reply tuple через conntrack IP и TCP destination port.'
        match_explanation: 'Проверяет reply tuple клиента и source port iperf.'
      - name: 'FIB source type'
        template: 'fib saddr type local ip saddr 198.18.{a}.{b} {action}'
        match_template: 'ip saddr 10.0.1.2 tcp dport 5201 {action}'
        explanation: 'Проверяет тип маршрута для source address через FIB.'
        match_explanation: 'Контрольное совпадение по клиентскому iperf-трафику.'
      - name: 'FIB destination type'
        template: 'fib daddr type local ip daddr 203.0.113.{b} {action}'
        match_template: 'ip daddr 10.0.2.2 tcp dport 5201 {action}'
        explanation: 'Проверяет тип маршрута для destination address через FIB.'
        match_explanation: 'Контрольное совпадение по серверному IP iperf.'
      - name: 'FIB source interface lookup'
        template: 'fib saddr . iif oif missing ip saddr 198.18.{a}.{b} {action}'
        match_template: 'ip saddr 10.0.1.2 tcp dport 5201 {action}'
        explanation: 'Проверяет FIB lookup по source address и входному интерфейсу.'
        match_explanation: 'Контрольное совпадение по клиентскому iperf-трафику.'
      - name: 'FIB destination interface lookup'
        template: 'fib daddr . iif oif missing ip daddr 203.0.113.{b} {action}'
        match_template: 'ip daddr 10.0.2.2 tcp dport 5201 {action}'
        explanation: 'Проверяет FIB lookup по destination address и входному интерфейсу.'
        match_explanation: 'Контрольное совпадение по серверному IP iperf.'
      - name: 'IPsec reqid'
        template: 'ipsec in reqid {reqid} ip saddr 198.18.{a}.{b} {action}'
        match_template: 'ip saddr 10.0.1.2 tcp dport 5201 {action}'
        explanation: 'Проверяет IPsec reqid с синтетическим значением.'
        match_explanation: 'Контрольное совпадение по клиентскому iperf-трафику.'
      - name: 'IPsec SPI'
        template: 'ipsec in spi {spi} ip saddr 198.18.{a}.{b} {action}'
        match_template: 'ip saddr 10.0.1.2 tcp dport 5201 {action}'
        explanation: 'Проверяет IPsec SPI с синтетическим значением.'
        match_explanation: 'Контрольное совпадение по клиентскому iperf-трафику.'
      - name: 'Socket transparent'
        template: 'socket transparent 1 ip saddr 198.18.{a}.{b} {action}'
        match_template: 'ip saddr 10.0.1.2 tcp dport 5201 {action}'
        explanation: 'Проверяет socket transparent, а IP дополнительно не совпадает с iperf.'
        match_explanation: 'Контрольное совпадение по клиентскому iperf-трафику.'
      - name: 'Route nexthop'
        template: 'rt ip nexthop 203.0.113.{b} ip saddr 198.18.{a}.{b} {action}'
        match_template: 'ip saddr 10.0.1.2 tcp dport 5201 {action}'
        explanation: 'Проверяет route nexthop и синтетический IP источника.'
        match_explanation: 'Контрольное совпадение по клиентскому iperf-трафику.'
      - name: 'Route classid'
        template: 'rt classid {mark} ip saddr 198.18.{a}.{b} {action}'
        match_template: 'ip saddr 10.0.1.2 tcp dport 5201 {action}'
        explanation: 'Проверяет route classid и синтетический IP источника.'
        match_explanation: 'Контрольное совпадение по клиентскому iperf-трафику.'
      - name: 'Route IP nexthop'
